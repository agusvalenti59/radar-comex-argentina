# Pipeline principal: Comtrade (anual, bilateral) -> bronze -> silver -> gold.
# Comtrade actualiza datos de forma escalonada a medida que los países reportan: corre semanal
# y la idempotencia del MERGE hace que re-procesar no duplique.
resources:
  jobs:
    trade_intel_annual:
      name: trade-intel-annual-${var.env}
      tags: {domain: trade-intelligence, layer: e2e}
      schedule:
        quartz_cron_expression: "0 0 6 ? * MON"
        timezone_id: America/Argentina/Buenos_Aires
      email_notifications:
        on_failure: [ "${var.alert_email}" ]
      health:
        rules:
          - metric: RUN_DURATION_SECONDS
            op: GREATER_THAN
            value: 7200
      max_concurrent_runs: 1
      job_clusters:
        - job_cluster_key: etl
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: ${var.node_type}
            data_security_mode: SINGLE_USER
            runtime_engine: PHOTON
            autoscale: {min_workers: 1, max_workers: 4}
            spark_env_vars:
              TRADE_INTEL_ENV: ${var.env}
              TRADE_INTEL_CONF_DIR: /Workspace${workspace.file_path}/conf
            custom_tags: {cost_center: trade-intel}
      tasks:
        - task_key: ingest_comtrade
          job_cluster_key: etl
          python_wheel_task: {package_name: trade_intel, entry_point: ti-ingest-comtrade}
          libraries: [{whl: ../../dist/*.whl}]
          max_retries: 2
          min_retry_interval_millis: 600000

        - task_key: bronze_comtrade
          depends_on: [{task_key: ingest_comtrade}]
          job_cluster_key: etl
          python_wheel_task: {package_name: trade_intel, entry_point: ti-bronze, parameters: ["--source", "comtrade"]}
          libraries: [{whl: ../../dist/*.whl}]

        - task_key: silver
          depends_on: [{task_key: bronze_comtrade}]
          job_cluster_key: etl
          python_wheel_task: {package_name: trade_intel, entry_point: ti-silver}
          libraries: [{whl: ../../dist/*.whl}]

        - task_key: gold
          depends_on: [{task_key: silver}]
          job_cluster_key: etl
          python_wheel_task: {package_name: trade_intel, entry_point: ti-gold}
          libraries: [{whl: ../../dist/*.whl}]

        - task_key: optimize
          depends_on: [{task_key: gold}]
          job_cluster_key: etl
          spark_python_task:
            python_file: ../../scripts/maintenance.py
            parameters: ["--catalog", "${var.catalog}"]
